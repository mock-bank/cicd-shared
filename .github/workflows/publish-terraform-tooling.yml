name: Publish Terraform Tooling to GAR

# Triggered by the release-please tag, so a release always has a SemVer version
# and a changelog before any image is published. Re-run this workflow on the
# same tag to recover a failed publish without changing the version.
on:
  push:
    tags:
    - 'v*'

permissions:
  contents: write # Attach signed release evidence to the GitHub release
  id-token: write

concurrency:
  group: publish-terraform-tooling-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, sign and promote tooling image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: tooling-publish

    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
    - name: Resolve release version from tag
      id: version
      run: |
        set -euo pipefail
        tag="${GITHUB_REF_NAME}"
        version="${tag#v}"
        if [[ "$tag" != "v$version" ]]; then
          echo 'Workflow must run from a v<semver> tag' >&2
          exit 1
        fi
        if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo 'Tag must contain numeric SemVer, for example v1.2.3' >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Checkout tooling source at the release tag
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Select image destinations
      id: target
      env:
        GAR_LOCATION: ${{ vars.GAR_LOCATION }}
        GAR_PROJECT_ID: ${{ vars.GAR_PROJECT_ID }}
        GAR_REPOSITORY_ALPHA: ${{ vars.GAR_REPOSITORY_ALPHA || vars.GAR_REPOSITORY }}
        GAR_REPOSITORY_BETA: ${{ vars.GAR_REPOSITORY_BETA || 'beta' }}
        GAR_REPOSITORY_LIVE: ${{ vars.GAR_REPOSITORY_LIVE || 'live' }}
      run: |
        set -euo pipefail
        for var in GAR_LOCATION GAR_PROJECT_ID GAR_REPOSITORY_ALPHA GAR_REPOSITORY_BETA GAR_REPOSITORY_LIVE; do
          [[ -n "${!var}" ]] || { echo "Missing GitHub variable: $var" >&2; exit 1; }
        done
        for value in "$GAR_LOCATION" "$GAR_PROJECT_ID" "$GAR_REPOSITORY_ALPHA" "$GAR_REPOSITORY_BETA" "$GAR_REPOSITORY_LIVE"; do
          [[ "$value" =~ ^[a-z][a-z0-9-]*$ ]] || { echo "Invalid GAR configuration" >&2; exit 1; }
        done
        [[ "$GAR_REPOSITORY_ALPHA" != "$GAR_REPOSITORY_BETA" ]] || { echo 'alpha and beta repositories must differ' >&2; exit 1; }
        [[ "$GAR_REPOSITORY_BETA" != "$GAR_REPOSITORY_LIVE" ]] || { echo 'beta and live repositories must differ' >&2; exit 1; }

        registry="${GAR_LOCATION}-docker.pkg.dev"
        prefix="${registry}/${GAR_PROJECT_ID}"
        echo "registry=$registry" >> "$GITHUB_OUTPUT"
        echo "alpha=${prefix}/${GAR_REPOSITORY_ALPHA}/terraform-tooling" >> "$GITHUB_OUTPUT"
        echo "beta=${prefix}/${GAR_REPOSITORY_BETA}/terraform-tooling" >> "$GITHUB_OUTPUT"
        echo "live=${prefix}/${GAR_REPOSITORY_LIVE}/terraform-tooling" >> "$GITHUB_OUTPUT"

    - name: Configure Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build locally for smoke test
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ./docker/terraform-tooling
        file: ./docker/terraform-tooling/Dockerfile
        platforms: linux/amd64
        load: true
        tags: terraform-tooling:smoke

    - name: Smoke test tooling
      run: |
        set -euo pipefail
        docker run --rm \
          --mount "type=bind,src=${PWD}/docker/terraform-tooling/smoke-test.sh,dst=/smoke-test.sh,readonly" \
          terraform-tooling:smoke \
          bash /smoke-test.sh

    - name: Authenticate to Google Cloud via WIF
      id: auth
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        token_format: access_token
        workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ vars.GCP_ARTIFACT_WRITER_SA }}

    - name: Authenticate Docker to GAR
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ steps.target.outputs.registry }}
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}

    - name: Push tooling image to alpha with attestations
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ./docker/terraform-tooling
        file: ./docker/terraform-tooling/Dockerfile
        platforms: linux/amd64
        push: true
        tags: ${{ steps.target.outputs.alpha }}:${{ steps.version.outputs.version }}
        provenance: mode=min
        sbom: true
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=${{ steps.version.outputs.version }}

    - name: Install Cosign
      uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0

    - name: Sign and verify the alpha image
      env:
        IMAGE: ${{ steps.target.outputs.alpha }}
        DIGEST: ${{ steps.build.outputs.digest }}
        COSIGN_KMS_KEY: ${{ vars.COSIGN_KMS_KEY_URI }}
      run: |
        set -euo pipefail
        [[ -n "$COSIGN_KMS_KEY" ]] || { echo 'Missing GitHub variable: COSIGN_KMS_KEY_URI' >&2; exit 1; }

        cosign sign --yes --key "$COSIGN_KMS_KEY" "${IMAGE}@${DIGEST}"
        cosign verify --key "$COSIGN_KMS_KEY" "${IMAGE}@${DIGEST}"

    # cosign copy carries the image, signature and attestations. The same digest
    # is promoted rather than rebuilding per environment.
    - name: Promote signed digest to beta and live
      env:
        IMAGE: ${{ steps.target.outputs.alpha }}
        BETA: ${{ steps.target.outputs.beta }}
        LIVE: ${{ steps.target.outputs.live }}
        DIGEST: ${{ steps.build.outputs.digest }}
        VERSION: ${{ steps.version.outputs.version }}
        COSIGN_KMS_KEY: ${{ vars.COSIGN_KMS_KEY_URI }}
      run: |
        set -euo pipefail
        source="${IMAGE}@${DIGEST}"
        cosign copy "$source" "${BETA}:${VERSION}"
        cosign copy "$source" "${LIVE}:${VERSION}"

        for target in "${BETA}@${DIGEST}" "${LIVE}@${DIGEST}"; do
          cosign verify --key "$COSIGN_KMS_KEY" "$target"
        done

    - name: Build release evidence
      env:
        VERSION: ${{ steps.version.outputs.version }}
        TAG: ${{ steps.version.outputs.tag }}
        DIGEST: ${{ steps.build.outputs.digest }}
        ALPHA: ${{ steps.target.outputs.alpha }}
        BETA: ${{ steps.target.outputs.beta }}
        LIVE: ${{ steps.target.outputs.live }}
        COSIGN_KMS_KEY: ${{ vars.COSIGN_KMS_KEY_URI }}
      run: |
        set -euo pipefail
        evidence_dir="${RUNNER_TEMP}/terraform-tooling-release"
        mkdir -p "$evidence_dir"

        jq -n \
          --arg version "$VERSION" \
          --arg tag "$TAG" \
          --arg revision "$GITHUB_SHA" \
          --arg digest "$DIGEST" \
          --arg alpha "${ALPHA}@${DIGEST}" \
          --arg beta "${BETA}:${VERSION}" \
          --arg live "${LIVE}:${VERSION}" \
          --arg key "$COSIGN_KMS_KEY" \
          '{
            schema_version: 1,
            version: $version,
            tag: $tag,
            revision: $revision,
            image: {
              tool: "terraform-tooling",
              digest: $digest,
              alpha: $alpha,
              beta: $beta,
              live: $live
            },
            signature: {
              kms_key: $key,
              verify: ("cosign verify --key " + $key + " " + $alpha)
            },
            consumers: {
              reusable_workflows_ref: $tag,
              pin_example: ("mock-bank/cicd-shared/.github/workflows/terraform-test.yml@" + $revision + " # " + $tag)
            }
          }' > "${evidence_dir}/release-manifest.json"

        {
          echo "## Verified tooling image"
          echo
          echo "- Version: \`${VERSION}\`"
          echo "- Digest: \`${DIGEST}\`"
          echo "- Source revision: \`${GITHUB_SHA}\`"
          echo "- Alpha: \`${ALPHA}@${DIGEST}\`"
          echo "- Beta: \`${BETA}@${DIGEST}\`"
          echo "- Live: \`${LIVE}@${DIGEST}\`"
          echo
          echo 'Verify with:'
          echo
          echo '```bash'
          echo "cosign verify --key '${COSIGN_KMS_KEY}' '${ALPHA}@${DIGEST}'"
          echo '```'
        } > "${evidence_dir}/VERIFY.md"

    - name: Attach signed evidence to the GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.version.outputs.tag }}
        EVIDENCE_DIR: ${{ runner.temp }}/terraform-tooling-release
      run: |
        set -euo pipefail
        gh release upload "$TAG" \
          "${EVIDENCE_DIR}/release-manifest.json" \
          "${EVIDENCE_DIR}/VERIFY.md" \
          --repo "$GITHUB_REPOSITORY" --clobber

    - name: Publish release summary
      env:
        VERSION: ${{ steps.version.outputs.version }}
        DIGEST: ${{ steps.build.outputs.digest }}
        ALPHA: ${{ steps.target.outputs.alpha }}
      run: |
        echo "### Terraform tooling ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
        echo "Digest: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "Alpha: \`${ALPHA}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "Consumers should pin the digest, not the mutable tag." >> "$GITHUB_STEP_SUMMARY"
