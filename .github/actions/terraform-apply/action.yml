name: Terraform apply (Docker)
description: Apply an approved binary Terraform plan in a pinned tooling container
inputs:
  tooling-image:
    description: Full approved image reference ending in @sha256:<64 hex characters>
    required: true
  working-directory:
    description: Path to Terraform root under the checkout workspace
    required: true
  plan-path:
    description: Absolute path to the approved binary plan file on the runner
    required: true
runs:
  using: composite
  steps:
  - name: Apply approved plan in Docker
    shell: bash
    env:
      TOOLING_IMAGE: ${{ inputs.tooling-image }}
      TF_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      TF_PLAN_PATH: ${{ inputs.plan-path }}
    run: bash "$GITHUB_ACTION_PATH/scripts/run-container.sh"
