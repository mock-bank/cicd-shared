name: Terraform security scan (Docker)
description: Run Checkov against a Terraform root in a pinned tooling container
inputs:
  tooling-image:
    description: Full approved image reference ending in @sha256:<64 hex characters>
    required: true
  working-directory:
    description: Path to Terraform root under the checkout workspace
    required: true
outputs:
  report-path:
    description: Runner directory containing the Checkov JSON report
    value: ${{ steps.scan.outputs.report-path }}
runs:
  using: composite
  steps:
  - name: Execute Checkov in Docker
    id: scan
    shell: bash
    env:
      TOOLING_IMAGE: ${{ inputs.tooling-image }}
      TF_WORKING_DIRECTORY: ${{ inputs.working-directory }}
    run: bash "$GITHUB_ACTION_PATH/scripts/run-container.sh"
